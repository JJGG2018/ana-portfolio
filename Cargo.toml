[package]
name = "ana_portfolio_wasm"
version = "0.1.0"
edition = "2021"
authors = ["Ana Galilea <agalilea.design@gmail.com>"]
description = "Portfolio interactivo tipo videojuego (24 Horas con Ana - Diorama Arquitectónico) en Rust + WebAssembly"

[lib]
name = "ana_portfolio_wasm"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
